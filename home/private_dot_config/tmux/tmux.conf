# tmux — modern config (tmux >= 3.2 reads ~/.config/tmux/tmux.conf natively)

# --- Terminal / colors ---------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # true color

# --- Behavior --------------------------------------------------------------------
set -g mouse on
set -s escape-time 0                      # no Esc delay (vim users care)
set -g history-limit 50000
set -g base-index 1                       # windows start at 1 (0 is far away)
setw -g pane-base-index 1
set -g renumber-windows on                # keep numbers gapless after close
set -g focus-events on                    # let nvim see focus changes
setw -g mode-keys vi                      # vi keys in copy mode
set -g set-titles on
set -g set-titles-string "#S / #W"

# --- Keybindings ------------------------------------------------------------------
# Splits: | and - are easier to remember, and open in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane movement (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (prefix + HJKL, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style selection in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- Status line (hand-rolled; yellow accent, nod to the old themepack) -------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-left "#[bg=colour220,fg=colour235,bold] #S #[bg=colour235] "
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour250,bold]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour238,fg=colour220,bold] #I:#W "
set -g pane-active-border-style "fg=colour220"
set -g pane-border-style "fg=colour238"

# --- Plugins (tpm; prefix + I to install) ---------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'       # sane copy to system clipboard
run '~/.tmux/plugins/tpm/tpm'
