# tmux — modern config (tmux >= 3.2 reads ~/.config/tmux/tmux.conf natively)
#
# Theme: jimeh/tmux-themepack (powerline/double/yellow), same as the original
# pre-chezmoi setup. To fully restore the original minimal config, see the
# copy preserved at ~/dev/bootstrap-machine/tmux/tmux.conf — it is just:
# mouse on, default-terminal, tpm + tmux-sensible + themepack, nothing else.
# (Everything below outside the Plugins section is newer additions on top.)

# --- Terminal / colors ---------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # true color

# --- Behavior --------------------------------------------------------------------
set -g mouse on
set -s escape-time 0                      # no Esc delay (vim users care)
set -g history-limit 50000
set -g base-index 1                       # windows start at 1 (0 is far away)
setw -g pane-base-index 1
set -g renumber-windows on                # keep numbers gapless after close
set -g focus-events on                    # let nvim see focus changes
setw -g mode-keys vi                      # vi keys in copy mode
set -g set-titles on
set -g set-titles-string "#S / #W"

# --- Keybindings ------------------------------------------------------------------
# Splits: | and - are easier to remember, and open in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane movement (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (prefix + HJKL, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style selection in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# --- Plugins (tpm; prefix + I to install) ---------------------------------------------
# Plugins live in ~/.config/tmux/plugins (tpm's default for configs under
# ~/.config/tmux; also where dracula/nord-plusplus/battery/pomodoro clones
# from earlier experiments still sit, unused).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'       # sane copy to system clipboard

# Themepack — https://github.com/jimeh/tmux-themepack
set -g @plugin 'jimeh/tmux-themepack'
set -g @themepack 'powerline/double/yellow'
# set -g @themepack 'powerline/double/magenta'

run '~/.config/tmux/plugins/tpm/tpm'
