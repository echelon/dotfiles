# Explicit format: modules not listed here never render, so no cloud/langver noise.
format = """
$username$hostname$directory$git_branch$git_status$cmd_duration$status$time
$character"""

add_newline = true

[username]
show_always = true
format = "[$user]($style)@"
style_user = "yellow"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "yellow"

[directory]
style = "cyan"
truncation_length = 4

[git_branch]
format = "[$symbol$branch]($style) "
style = "purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "red"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "bold yellow"

[status]
disabled = false
format = "[✘ $status]($style) "
style = "bold red"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
style = "dimmed white"
